# Overrides for the upstream chart "podinfo".
# Everything nests under the dependency name so Helm routes it to the subchart.
# Pull the upstream defaults with:
#   helm show values podinfo --repo https://stefanprodan.github.io/podinfo --version 6.15.0
# then copy ONLY the keys you are changing under the block below.
#
# Starts as an empty map ({}) so Helm has a valid (no-op) value for the subchart.
# Replace {} with a real mapping when you add overrides, e.g.:
#   podinfo:
#     image:
#       tag: "6.15.0"
podinfo: {}
