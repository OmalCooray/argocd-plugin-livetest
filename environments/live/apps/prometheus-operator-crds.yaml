apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/OmalCooray/argocd-plugin-livetest
      targetRevision: master
      path: charts/prometheus-operator-crds
      helm:
        valueFiles:
          - $values/environments/live/values/prometheus-operator-crds.yaml
    - repoURL: https://github.com/OmalCooray/argocd-plugin-livetest
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
